# Included ONLY inside the TLS server for api.zhangzr.xyz.
# The 43-character temporary verification token is the credential.
location ^~ /verify/ {
    access_log off;
    # Upstream errors must not write the credential-bearing request URI.
    error_log /dev/null crit;

    if ($uri !~ "^/verify/[A-Za-z0-9_-]{43}(/state)?$") { return 404; }
    if ($request_method != GET) { return 405; }

    proxy_pass http://127.0.0.1:18060;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
